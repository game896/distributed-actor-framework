syntax = "proto3";

package taskpb;
option go_package = "github.com/anomalyco/distributed-actor-framework/example/taskpb";

message TaskPayload {
  string task_id = 1;
  string task_type = 2;
  int32 a = 3;
  int32 b = 4;
  int32 n = 5;
  string input = 6;
  int32 duration_ms = 7;
}

message ResultPayload {
  string task_id = 1;
  string task_type = 2;
  string result = 3;
  string worker_id = 4;
  bool success = 5;
}

message RegisterPayload {
  string worker_id = 1;
  string address = 2;
}

message HeartbeatPayload {
  string worker_id = 1;
  string address = 2;
}
